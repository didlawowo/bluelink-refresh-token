apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bluelink-token.fullname" . }}
  labels:
    {{- include "bluelink-token.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bluelink-token.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bluelink-token.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/run-standalone.sh"]
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.config }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: BLUELINK_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "bluelink-token.secretName" . }}
              key: BLUELINK_USERNAME
        - name: BLUELINK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bluelink-token.secretName" . }}
              key: BLUELINK_PASSWORD
        - name: EVCC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bluelink-token.secretName" . }}
              key: EVCC_PASSWORD
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "bluelink-token.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
